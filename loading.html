<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./theme-boot.js"></script>
    <title>Loading</title>
    <link rel="stylesheet" href="./loading.css" />
  </head>
  <body>
    <div class="loading-screen" role="status" aria-live="polite" aria-label="페이지 로딩 중">
      <div class="loading-title" aria-hidden="true">
        <span class="letter">L</span><span class="letter">O</span><span class="letter">A</span><span class="letter">D</span><span class="letter">I</span><span class="letter">N</span><span class="letter">G</span>
      </div>
      <div class="loading-bar" aria-hidden="true">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
      <p class="loading-caption">버그도 기능이다. 접속 중...</p>
    </div>
    <script src="./loading.js"></script>
  </body>
</html>
